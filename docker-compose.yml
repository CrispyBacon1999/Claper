services:
  
  app:
    image: ghcr.io/claperco/claper:latest # or build: .
    ports:
      - 4000:4000
    volumes:
      - "claper-uploads:/app/uploads"
    healthcheck:
      test: curl --fail http://localhost:4000 || exit 1
      retries: 3
      start_period: 20s
      timeout: 5s
    env_file: .env
    networks:
      - claper-net
      - coolify
  

volumes:
  claper-uploads:
    driver: local

networks:
  claper-net:
    driver: bridge
  
  coolify:
    external: true
    name: coolify